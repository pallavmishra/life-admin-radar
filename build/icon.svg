<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS Big Sur+ grid: 824×824 body, ~185 corner radius, centred -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0a1a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="512" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f5d6e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1f5d6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="512" y1="512" x2="800" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ef0c5" stop-opacity=".0"/>
      <stop offset="1" stop-color="#5ef0c5" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="blipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- range rings -->
    <g fill="none" stroke="#5ef0c5" stroke-opacity=".36" stroke-width="8">
      <circle cx="512" cy="512" r="330"/>
      <circle cx="512" cy="512" r="235"/>
      <circle cx="512" cy="512" r="140"/>
    </g>
    <!-- crosshair -->
    <g stroke="#5ef0c5" stroke-opacity=".16" stroke-width="4">
      <line x1="182" y1="512" x2="842" y2="512"/>
      <line x1="512" y1="182" x2="512" y2="842"/>
    </g>
    <!-- sweep wedge (≈55°) ending on the leading edge -->
    <path d="M512 512 L842 512 A330 330 0 0 0 701.3 241.7 Z" fill="url(#sweep)" transform="rotate(-8 512 512)"/>
    <line x1="512" y1="512" x2="701.3" y2="241.7" stroke="#8ff7d8" stroke-width="10" stroke-linecap="round" transform="rotate(-8 512 512)"/>

    <!-- blip 1: a document (paperwork) on the leading edge, bright -->
    <g filter="url(#blipGlow)" transform="translate(700 360) rotate(-8)">
      <path d="M-34 -44 h44 l24 24 v64 h-68 z" fill="#eafff8"/>
      <path d="M10 -44 v24 h24" fill="#a8f5dc"/>
      <g stroke="#1b4f5e" stroke-width="7" stroke-linecap="round">
        <line x1="-20" y1="0" x2="20" y2="0"/>
        <line x1="-20" y1="18" x2="20" y2="18"/>
      </g>
    </g>
    <!-- blip 2: a calendar, fading (swept a moment ago) -->
    <g opacity=".75" transform="translate(360 660)">
      <rect x="-36" y="-32" width="72" height="64" rx="10" fill="#bff7e6"/>
      <rect x="-36" y="-32" width="72" height="20" rx="10" fill="#ff8a65"/>
      <rect x="-36" y="-20" width="72" height="8" fill="#ff8a65"/>
      <g fill="#1b4f5e"><circle cx="-16" cy="4" r="6"/><circle cx="4" cy="4" r="6"/><circle cx="-16" cy="20" r="6"/></g>
    </g>
    <!-- blip 3: small dot, oldest -->
    <circle cx="660" cy="690" r="16" fill="#5ef0c5" opacity=".45"/>
    <!-- centre -->
    <circle cx="512" cy="512" r="18" fill="#8ff7d8"/>
  </g>
</svg>
